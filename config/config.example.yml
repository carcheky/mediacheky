# MediaCheky Configuration Example
# Copy this file to config.yml and customize

app:
  environment: production  # production or development
  loglevel: info          # debug, info, warn, error

server:
  host: 0.0.0.0
  port: 8080

database:
  type: sqlite
  path: /data/mediacheky.db

# Service configurations (optional - can be managed via web UI)
services:
  jellyfin:
    enabled: false
    image: jellyfin/jellyfin:latest
    port: "8096"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
    volumes:
      - "./jellyfin/config:/config"
      - "./media:/media:ro"
      - "./jellyfin/cache:/cache"

  sonarr:
    enabled: false
    image: linuxserver/sonarr:latest
    port: "8989"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
    volumes:
      - "./sonarr/config:/config"
      - "./media/tv:/tv"
      - "./downloads:/downloads"

  radarr:
    enabled: false
    image: linuxserver/radarr:latest
    port: "7878"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
    volumes:
      - "./radarr/config:/config"
      - "./media/movies:/movies"
      - "./downloads:/downloads"

  prowlarr:
    enabled: false
    image: linuxserver/prowlarr:latest
    port: "9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
    volumes:
      - "./prowlarr/config:/config"

  qbittorrent:
    enabled: false
    image: linuxserver/qbittorrent:latest
    port: "8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
      WEBUI_PORT: "8080"
    volumes:
      - "./qbittorrent/config:/config"
      - "./downloads:/downloads"

  jellyseerr:
    enabled: false
    image: fallenbagel/jellyseerr:latest
    port: "5055"
    environment:
      TZ: "Europe/Madrid"
    volumes:
      - "./jellyseerr/config:/app/config"

  qbitmanager:
    enabled: false
    image: bobokun/qbit_manage:latest
    port: ""
    environment:
      TZ: "Europe/Madrid"
    volumes:
      - "./qbitmanager/config:/config"

  dockercontroller:
    enabled: false
    image: carcheky/docker-controller-bot:latest
    port: ""
    environment:
      TZ: "Europe/Madrid"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  bazarr:
    enabled: false
    image: linuxserver/bazarr:latest
    port: "6767"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Madrid"
    volumes:
      - "./bazarr/config:/config"
      - "./media:/media"

  jellystat:
    enabled: false
    image: cyfershepard/jellystat:latest
    port: "3000"
    environment:
      TZ: "Europe/Madrid"
    volumes:
      - "./jellystat/data:/app/backend/backup-data"
