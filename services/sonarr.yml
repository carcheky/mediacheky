services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./volumes/sonarr-config:/config
      - ./volumes/media-library/tv:/tv
      - ./volumes/media-library/downloads:/downloads
    networks:
      - mediacheky-net
    restart: unless-stopped

networks:
  mediacheky-net:
    external: true
