version: '3.8'

services:
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ${CONFIG_BASE_PATH}/bazarr:/config
      - ${BASE_MEDIA_PATH}/${MOVIES_PATH}:/movies
      - ${BASE_MEDIA_PATH}/${SERIES_PATH}:/tv
    restart: unless-stopped
    networks:
      - mediacheky_mediacheky-net

networks:
  mediacheky_mediacheky-net:
    external: true
