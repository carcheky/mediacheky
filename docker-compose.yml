services:
  # MediaCheky Application - Multimedia Server Management System
  mediacheky:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      cache_from:
        - mediacheky:dev-cache
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: mediacheky:dev
    container_name: mediacheky-dev
    ports:
      - "${MEDIACHEKY_SERVER_PORT:-80}:7369"
      - "${MEDIACHEKY_SERVER_PORT_SSL:-443}:7370"
    volumes:
      # REQUIRED TO PROD Persistent data (production + development)
      - ${MEDIACHEKY_APP_DATA:-./volumes/mediacheky-data}:/app/data
      - ${MEDIACHEKY_MEDIA_PATH:-./volumes/library}:/MEDIACHEKY_LIBRARY

      # Development only - Hot reload & debugging
      - ./volumes/go-modules-cache:/go/pkg/mod  # Go modules cache (named volume for speed)
      - ./logs:/app/logs  # Logs accessible from host
      - ./.air.toml:/app/.air.toml  # Air configuration
      - ./go.mod:/app/go.mod  # Go modules
      - ./go.sum:/app/go.sum
      - ./cmd:/app/cmd  # Source code sync
      - ./internal:/app/internal
      - ./pkg:/app/pkg
      - ./web:/app/web
      - ./templates:/app/templates  # Template hot-reload
      - ./services:/app/services  # Service definitions hot-reload
      
      # REQUIRED TO PROD Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Application configuration
      - MEDIACHEKY_APP_ENVIRONMENT=${MEDIACHEKY_APP_ENVIRONMENT:-development}
      - MEDIACHEKY_APP_LOG_LEVEL=${MEDIACHEKY_APP_LOG_LEVEL:-debug}
      # REQUIRED TO PROD Host path for resolving service volume mounts
      - MEDIACHEKY_HOST_PATH=${PWD}
    networks:
      - mediacheky-net
    restart: always

networks:
  mediacheky-net:
    driver: bridge
