services:
  # MediaCheky Application - Multimedia Server Management System
  mediacheky:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      cache_from:
        - mediacheky:dev-cache
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: mediacheky:dev
    container_name: mediacheky-dev
    ports:
      - "${MEDIACHEKY_SERVER_PORT:-7369}:7369"
      - "${MEDIACHEKY_SERVER_PORT_SSL:-7370}:7370"
    volumes:
      # Persistent data (production + development)
      - ./volumes/mediacheky-data:/app/data
      - ${MEDIACHEKY_MEDIA_PATH:-./volumes/MEDIACHEKY_MEDIA_PATH}:/MEDIACHEKY_LIBRARY
      
      # Development only - Hot reload & debugging
      - go-modules-cache:/go/pkg/mod  # Go modules cache (named volume for speed)
      - ./logs:/app/logs  # Logs accessible from host
      - ./.air.toml:/app/.air.toml  # Air configuration
      - ./go.mod:/app/go.mod  # Go modules
      - ./go.sum:/app/go.sum
      - ./cmd:/app/cmd  # Source code sync
      - ./internal:/app/internal
      - ./pkg:/app/pkg
      - ./web:/app/web
      - ./templates:/app/templates  # Template hot-reload
      - ./services:/app/services  # Service definitions hot-reload
      
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Application configuration
      - MEDIACHEKY_APP_ENVIRONMENT=${MEDIACHEKY_APP_ENVIRONMENT:-development}
      - MEDIACHEKY_APP_LOG_LEVEL=${MEDIACHEKY_APP_LOG_LEVEL:-info}
      - MEDIACHEKY_APP_DRY_RUN=${MEDIACHEKY_APP_DRY_RUN:-false}
      - MEDIACHEKY_SERVER_PORT=${MEDIACHEKY_SERVER_PORT:-7369}
      - MEDIACHEKY_DATABASE_TYPE=${MEDIACHEKY_DATABASE_TYPE:-sqlite}
      - MEDIACHEKY_DATABASE_PATH=${MEDIACHEKY_DATABASE_PATH:-/app/data/mediacheky.db}
    develop:
      watch:
        # Rebuild on go.mod changes or source code updates
        - path: ./go.mod
          action: rebuild
        - path: ./go.sum
          action: rebuild
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild
        - path: ./pkg
          action: rebuild
    networks:
      - mediacheky-net
    restart: unless-stopped

