services:
  # MediaCheky Application - Multimedia Server Management System
  # Final Test - Uses locally built production image
  mediacheky:
    image: mediacheky:finaltest
    container_name: mediacheky-finaltest
    ports:
      - "${MEDIACHEKY_SERVER_PORT:-80}:7369"
      - "${MEDIACHEKY_SERVER_PORT_SSL:-443}:7370"
    volumes:
      # Persistent data (production + development)
      - ${MEDIACHEKY_APP_DATA:-./volumes/mediacheky-data}:/app/data
      - ${MEDIACHEKY_MEDIA_PATH:-./volumes/library}:/MEDIACHEKY_LIBRARY

      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Host path for resolving service volume mounts
      - MEDIACHEKY_HOST_PATH=${PWD}
    networks:
      - mediacheky-net
    restart: always

networks:
  mediacheky-net:
    driver: bridge
