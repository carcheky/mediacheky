<div x-data="servicesPage()" x-init="init()" class="space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-dark-text dark:text-dark-text">Services <span class="ml-2 px-2 py-1 text-xs rounded bg-blue-900/40 border border-blue-700 text-blue-200">new-ui</span></h1>
        <div class="flex gap-3">
            <button @click="reload()"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v6h6M20 20v-6h-6M20 8a8 8 0 10-7.906 7"/>
                </svg>
                <span>Reload</span>
            </button>
        </div>
    </div>

    <!-- Services Content -->
    <div class="space-y-10">
        <!-- Media Server Section -->
        <div>
            <h3 class="text-lg font-semibold text-dark-text mb-3 flex items-center gap-2">📺 Media Server</h3>
            <div class="space-y-3">
                <template x-for="service in getServicesByCategory('media-server')" :key="service.id">
                    <div class="flex items-center justify-between p-4 rounded-lg border border-dark-border bg-dark-bg">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl" x-text="service.icon || '⚙️'"></div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="font-semibold text-dark-text" x-text="service.label"></h3>
                                    <span x-show="serviceStatuses[service.id]?.enabled" class="px-2 py-0.5 text-xs rounded-full bg-green-900/30 border border-green-600/50 text-green-300">Active</span>
                                    <span x-show="!serviceStatuses[service.id]?.enabled" class="px-2 py-0.5 text-xs rounded-full bg-gray-700 text-gray-400">Inactive</span>
                                </div>
                                <p class="text-sm text-dark-muted" x-text="service.description || 'No description available'"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button @click="toggleService(service.id)"
                                    class="px-3 py-2 rounded-md text-sm"
                                    :class="serviceStatuses[service.id]?.enabled ? 'bg-red-600 text-white hover:bg-red-700' : 'bg-green-600 text-white hover:bg-green-700'">
                                <span x-text="serviceStatuses[service.id]?.enabled ? 'Disable' : 'Enable'"></span>
                            </button>
                            <a x-show="serviceStatuses[service.id]?.enabled"
                               :href="'/services/' + service.id"
                               class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">
                                Configure
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- *arr Services Section -->
        <div>
            <h3 class="text-lg font-semibold text-dark-text mb-3 flex items-center gap-2">📦 *arr Services</h3>
            <div class="space-y-3">
                <template x-for="service in getServicesByCategory('arr')" :key="service.id">
                    <div class="flex items-center justify-between p-4 rounded-lg border border-dark-border bg-dark-bg">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl" x-text="service.icon || '⚙️'"></div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="font-semibold text-dark-text" x-text="service.label"></h3>
                                    <span x-show="serviceStatuses[service.id]?.enabled" class="px-2 py-0.5 text-xs rounded-full bg-green-900/30 border border-green-600/50 text-green-300">Active</span>
                                    <span x-show="!serviceStatuses[service.id]?.enabled" class="px-2 py-0.5 text-xs rounded-full bg-gray-700 text-gray-400">Inactive</span>
                                </div>
                                <p class="text-sm text-dark-muted" x-text="service.description || 'No description available'"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button @click="toggleService(service.id)"
                                    class="px-3 py-2 rounded-md text-sm"
                                    :class="serviceStatuses[service.id]?.enabled ? 'bg-red-600 text-white hover:bg-red-700' : 'bg-green-600 text-white hover:bg-green-700'">
                                <span x-text="serviceStatuses[service.id]?.enabled ? 'Disable' : 'Enable'"></span>
                            </button>
                            <a x-show="serviceStatuses[service.id]?.enabled"
                               :href="'/services/' + service.id"
                               class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">
                                Configure
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Other Services Section -->
        <div>
            <h3 class="text-lg font-semibold text-dark-text mb-3 flex items-center gap-2">🔧 Other Services</h3>
            <div class="space-y-3">
                <template x-for="service in getServicesByCategory('other')" :key="service.id">
                    <div class="flex items-center justify-between p-4 rounded-lg border border-dark-border bg-dark-bg">
                        <div class="flex items-center gap-4">
                            <div class="text-3xl" x-text="service.icon || '⚙️'"></div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="font-semibold text-dark-text" x-text="service.label"></h3>
                                    <span x-show="serviceStatuses[service.id]?.enabled" class="px-2 py-0.5 text-xs rounded-full bg-green-900/30 border border-green-600/50 text-green-300">Active</span>
                                    <span x-show="!serviceStatuses[service.id]?.enabled" class="px-2 py-0.5 text-xs rounded-full bg-gray-700 text-gray-400">Inactive</span>
                                </div>
                                <p class="text-sm text-dark-muted" x-text="service.description || 'No description available'"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button @click="toggleService(service.id)"
                                    class="px-3 py-2 rounded-md text-sm"
                                    :class="serviceStatuses[service.id]?.enabled ? 'bg-red-600 text-white hover:bg-red-700' : 'bg-green-600 text-white hover:bg-green-700'">
                                <span x-text="serviceStatuses[service.id]?.enabled ? 'Disable' : 'Enable'"></span>
                            </button>
                            <a x-show="serviceStatuses[service.id]?.enabled"
                               :href="'/services/' + service.id"
                               class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">
                                Configure
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Floating Toast Messages -->
    <div x-show="message"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="fixed top-4 right-4 z-50 min-w-[300px] max-w-md shadow-2xl rounded-lg border p-4 flex items-start gap-3"
         :class="{
            'bg-green-900/95 border-green-600/50': messageType === 'success',
            'bg-red-900/95 border-red-600/50': messageType === 'error',
            'bg-blue-900/95 border-blue-600/50': messageType === 'info'
         }">
        <div class="flex-shrink-0">
            <svg x-show="messageType === 'success'" class="w-6 h-6 text-green-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            <svg x-show="messageType === 'error'" class="w-6 h-6 text-red-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
            <svg x-show="messageType === 'info'" class="w-6 h-6 text-blue-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
        </div>
        <div class="flex-1">
            <p class="text-sm font-medium"
               :class="{
                  'text-green-200': messageType === 'success',
                  'text-red-200': messageType === 'error',
                  'text-blue-200': messageType === 'info'
               }"
               x-text="message"></p>
        </div>
        <button @click="message = ''" class="flex-shrink-0 text-white/60 hover:text-white/90 transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
        </button>
    </div>
</div>

<script>
function servicesPage() {
    return {
        message: '',
        messageType: 'success',
        serviceStatuses: {},
        services: [
            { id: 'jellyfin',   label: 'Jellyfin',   icon: '🍿', category: 'media-server', description: 'Media server for streaming movies, TV shows, and music' },
            { id: 'radarr',     label: 'Radarr',     icon: '🎬', category: 'arr',          description: 'Movie collection manager for Usenet and BitTorrent' },
            { id: 'sonarr',     label: 'Sonarr',     icon: '📺', category: 'arr',          description: 'TV series collection manager for Usenet and BitTorrent' },
            { id: 'prowlarr',   label: 'Prowlarr',   icon: '🔍', category: 'arr',          description: 'Indexer manager/proxy for Radarr, Sonarr, and other services' },
            { id: 'bazarr',     label: 'Bazarr',     icon: '🗣️', category: 'arr',          description: 'Subtitle management companion for Radarr and Sonarr' },
            { id: 'jellyseerr', label: 'Jellyseerr', icon: '🎫', category: 'other',        description: 'Media request management for Jellyfin' },
            { id: 'jellystat',  label: 'Jellystat',  icon: '📊', category: 'other',        description: 'Statistics and analytics for Jellyfin' },
            { id: 'qbittorrent',label: 'qBittorrent',icon: '⬇️', category: 'other',        description: 'BitTorrent client for downloading media' }
        ],
        getServicesByCategory(category) { return this.services.filter(s => s.category === category); },
            getEnabledByCategory(category) {
                const list = this.getServicesByCategory(category);
                return list.filter(s => this.serviceStatuses[s.id]?.enabled);
            },
        async init() { await this.loadServiceStatuses(); },
        async reload() { await this.loadServiceStatuses(); this.showMessage('Services reloaded', 'success'); },
        async loadServiceStatuses() {
            try {
                const response = await fetch('/api/services');
                if (response.ok) {
                    const data = await response.json();
                    const list = data.data || [];
                    this.serviceStatuses = {};
                    list.forEach(svc => { this.serviceStatuses[svc.name] = { enabled: svc.enabled, status: svc.status }; });
                }
            } catch (err) { console.error('Failed to load services', err); }
        },
        async toggleService(serviceId) {
            try {
                const enabled = !!this.serviceStatuses[serviceId]?.enabled;
                const url = enabled ? `/api/services/${serviceId}/disable` : `/api/services/${serviceId}/enable`;
                const resp = await fetch(url, { method: 'POST' });
                if (!resp.ok) throw new Error('toggle failed');
                await this.loadServiceStatuses();
                this.showMessage(enabled ? `${serviceId} disabled` : `${serviceId} enabled`, 'success');
            } catch (e) {
                console.error('toggleService error', e);
                this.showMessage(`Failed to toggle ${serviceId}`, 'error');
            }
        },
        showMessage(msg, type = 'success') {
            this.message = msg; this.messageType = type;
            const delay = type === 'success' ? 5000 : 8000;
            setTimeout(() => { this.message = ''; }, delay);
        }
    }
}
</script>
