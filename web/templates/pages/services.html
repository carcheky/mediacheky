    <!-- Floating Toast Messages -->
    <div x-show="message"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"

         :class="{
            'bg-green-900/95 border-green-600/50': messageType === 'success',
            'bg-red-900/95 border-red-600/50': messageType === 'error',
            'bg-blue-900/95 border-blue-600/50': messageType === 'info'
         }">
        <div class="flex-shrink-0">
            <svg x-show="messageType === 'success'" class="w-6 h-6 text-green-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            <svg x-show="messageType === 'error'" class="w-6 h-6 text-red-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
            <svg x-show="messageType === 'info'" class="w-6 h-6 text-blue-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>

               x-text="message"></p>

<script>
function servicesPage() {
    return {
        message: '',
        messageType: 'success',
        serviceStatuses: {},
        pruning: {},
        toggling: {},
        services: [
            { id: 'jellyfin',   label: 'Jellyfin',   icon: '🍿', category: 'media-server', description: 'Media server for streaming movies, TV shows, and music' },
            { id: 'radarr',     label: 'Radarr',     icon: '🎬', category: 'arr',          description: 'Movie collection manager for Usenet and BitTorrent' },
            { id: 'sonarr',     label: 'Sonarr',     icon: '📺', category: 'arr',          description: 'TV series collection manager for Usenet and BitTorrent' },
            { id: 'prowlarr',   label: 'Prowlarr',   icon: '🔍', category: 'arr',          description: 'Indexer manager/proxy for Radarr, Sonarr, and other services' },
            { id: 'bazarr',     label: 'Bazarr',     icon: '🗣️', category: 'arr',          description: 'Subtitle management companion for Radarr and Sonarr' },
            { id: 'jellyseerr', label: 'Jellyseerr', icon: '🎫', category: 'other',        description: 'Media request management for Jellyfin' },
            { id: 'jellystat',  label: 'Jellystat',  icon: '📊', category: 'other',        description: 'Statistics and analytics for Jellyfin' },
            { id: 'qbittorrent',label: 'qBittorrent',icon: '⬇️', category: 'other',        description: 'BitTorrent client for downloading media' }
        ],
        getServicesByCategory(category) { return this.services.filter(s => s.category === category); },
        getAllServicesSorted() {
            // Returns all services sorted: enabled first, then disabled
            return [...this.services].sort((a, b) => {
                const aEnabled = this.serviceStatuses[a.id]?.enabled ? 1 : 0;
                const bEnabled = this.serviceStatuses[b.id]?.enabled ? 1 : 0;
                if (aEnabled !== bEnabled) return bEnabled - aEnabled; // Enabled first
                return a.label.localeCompare(b.label); // Then alphabetically
            });
        },
        getEnabledByCategory(category) {
            const list = this.getServicesByCategory(category);
            return list.filter(s => this.serviceStatuses[s.id]?.enabled);
        },
        async init() { 
            // Initialize pruning and toggling state for all services
            this.services.forEach(s => { 
                this.pruning[s.id] = false;
                this.toggling[s.id] = false;
            });
            await this.loadServiceStatuses(); 
            await this.checkConfigPaths();
        },
        async reload() { 
            await this.loadServiceStatuses(); 
            await this.checkConfigPaths();
            this.showMessage(window.i18n.t('services.reloaded'), 'success'); 
        },
        async loadServiceStatuses() {
            try {
                const response = await fetch('/api/services');
                if (response.ok) {
                    const data = await response.json();
                    const list = data.data || [];
                    // Initialize with Alpine.js reactivity
                    const newStatuses = {};
                    list.forEach(svc => { 
                        newStatuses[svc.name] = { 
                            enabled: svc.enabled, 
                            status: svc.status,
                            config_path_exists: false
                        }; 
                    });
                    this.serviceStatuses = newStatuses;
                }
            } catch (err) { console.error('Failed to load services', err); }
        },
        async checkConfigPaths() {
            for (const service of this.services) {
                if (!this.serviceStatuses[service.id]) continue;
                
                try {
                    const response = await fetch(`/api/services/${service.id}/config-exists`);
                    if (response.ok) {
                        const data = await response.json();
                        const exists = data.data?.exists || false;
                        console.log(`Config exists for ${service.id}:`, exists);
                        // Force reactivity by creating new object
                        this.serviceStatuses[service.id] = {
                            ...this.serviceStatuses[service.id],
                            config_path_exists: exists
                        };
                    }
                } catch (err) {
                    console.error(`Failed to check config path for ${service.id}`, err);
                }
            }
        },
        async toggleService(serviceId) {
            const enabled = !!this.serviceStatuses[serviceId]?.enabled;
            const action = enabled ? 'Disabling' : 'Enabling';
            
            // Mark as toggling immediately
            this.toggling[serviceId] = true;
            
            try {
                if (enabled) {
                    // Disable service
                    if (!confirm(window.i18n.t('services.disable.confirm').replace('{service}', serviceId))) {
                        this.toggling[serviceId] = false;
                        return;
                    }
                    
                    // Use a direct approach for disable (simple and fast)
                    const resp = await fetch(`/api/services/${serviceId}/disable`, { method: 'POST' });
                    if (!resp.ok) {
                        throw new Error('Failed to disable service');
                    }
                    
                    // Complete ALL operations first
                    await this.loadServiceStatuses();
                    await this.checkConfigPaths();
                    
                    // THEN show success message
                    this.showMessage(`${serviceId} disabled successfully`, 'success');
                } else {
                    // Enable service (backend waits until fully ready for Radarr/Sonarr)
                    const resp = await fetch(`/api/services/${serviceId}/enable`, { 
                        method: 'POST' 
                    });
                    
                    if (!resp.ok) {
                        throw new Error('Failed to enable service');
                    }
                    
                    // Backend has waited for service to be fully ready
                    // Now update UI state
                    await this.loadServiceStatuses();
                    await this.checkConfigPaths();
                    
                    // Show success message (service is guaranteed to be ready)
                    this.showMessage(`${serviceId} enabled successfully`, 'success');
                }
            } catch (error) {
                this.showMessage(`Failed to ${action.toLowerCase()} ${serviceId}: ${error.message}`, 'error');
            } finally {
                this.toggling[serviceId] = false;
            }
        },
        async pruneService(serviceId) {
            console.log('pruneService called for:', serviceId);
            // REQUIRES confirmation before executing
            if (!confirm(`⚠️ WARNING: This will:\n\n1. Stop the ${serviceId} service (docker compose down -v)\n2. Remove all volumes\n3. Delete service configuration folders\n4. Disable the service\n\nThis action CANNOT be undone.\n\nAre you sure you want to continue?`)) {
                return;
            }

            this.pruning[serviceId] = true;
            try {
                // Call reset endpoint (does all the work)
                const response = await fetch(`/api/services/${serviceId}/reset`, {
                    method: 'POST'
                });

                if (response.ok) {
                    // Deshabilita y oculta botón
                    this.serviceStatuses[serviceId].enabled = false;
                    this.serviceStatuses[serviceId].config_path_exists = false;
                    this.showMessage(`${serviceId} pruned successfully! All config and volumes removed.`, 'success');
                    // Espera breve para backend
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    // Recarga TODO el estado
                    await this.loadServiceStatuses();
                    await this.checkConfigPaths();
                } else {
                    const data = await response.json();
                    this.showMessage(data.error || `Failed to prune ${serviceId}`, 'error');
                }
            } catch (error) {
                this.showMessage('Error: ' + error.message, 'error');
            } finally {
                this.pruning[serviceId] = false;
            }
        },
        showMessage(msg, type = 'success') {
            // Use global toast system
            if (window.showToast) {
                window.showToast(msg, type);
            } else {
                // Fallback if toast manager not ready yet
                console.warn('Toast manager not ready, queueing message');
                window.queueToast(msg, type);
            }
        }
    }
}
</script>
