<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-server text-2xl"></i>
                    <h1 class="text-2xl font-bold">MediaCheky</h1>
                </div>
                <div class="flex space-x-6">
                    <a href="/" class="hover:text-blue-200 transition">
                        <i class="fas fa-home mr-2"></i>Inicio
                    </a>
                    <a href="/services" class="hover:text-blue-200 transition">
                        <i class="fas fa-cogs mr-2"></i>Servicios
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {{embed}}
    </main>

    <footer class="bg-gray-800 text-white mt-12 py-6">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 MediaCheky - Sistema de gestión de servidores multimedia</p>
        </div>
    </footer>
</body>
</html>
