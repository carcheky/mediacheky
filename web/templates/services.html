<div class="max-w-6xl mx-auto" x-data="servicesManager()">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-3xl font-bold text-gray-800">
                <i class="fas fa-cogs text-blue-600 mr-3"></i>
                Gestión de Servicios
            </h2>
            <button @click="downloadCompose" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-4 py-2 rounded-lg transition">
                <i class="fas fa-download mr-2"></i>
                Descargar Docker Compose
            </button>
        </div>

        <div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 mb-6">
            <p class="text-yellow-800">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <strong>Nota:</strong> Active los servicios que desee utilizar. Después descargue el archivo docker-compose.yml generado.
            </p>
        </div>

        <div class="grid grid-cols-1 gap-4">
            {{range .services}}
            <div class="border border-gray-200 rounded-lg p-6 hover:shadow-md transition">
                <div class="flex items-center justify-between">
                    <div class="flex-1">
                        <div class="flex items-center space-x-4">
                            <h3 class="text-xl font-semibold text-gray-800">{{.DisplayName}}</h3>
                            {{if .WebPort}}
                            <span class="text-sm text-gray-600">
                                <i class="fas fa-network-wired mr-1"></i>Puerto: {{.WebPort}}
                            </span>
                            {{end}}
                        </div>
                        <p class="text-sm text-gray-600 mt-2">
                            <i class="fas fa-docker text-blue-500 mr-2"></i>{{.Image}}
                        </p>
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" 
                                   class="sr-only peer" 
                                   {{if .Enabled}}checked{{end}}
                                   @change="toggleService('{{.Name}}', $event.target.checked)">
                            <div class="w-14 h-7 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                        
                        {{if .Enabled}}
                        <span class="bg-green-100 text-green-800 text-sm px-3 py-1 rounded-full font-medium">
                            <i class="fas fa-check-circle mr-1"></i>Activo
                        </span>
                        {{else}}
                        <span class="bg-gray-100 text-gray-600 text-sm px-3 py-1 rounded-full font-medium">
                            <i class="fas fa-times-circle mr-1"></i>Inactivo
                        </span>
                        {{end}}
                    </div>
                </div>
            </div>
            {{end}}
        </div>
    </div>
</div>

<script>
function servicesManager() {
    return {
        async toggleService(name, enabled) {
            try {
                const response = await fetch(`/api/services/${name}/toggle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ enabled })
                });

                if (!response.ok) {
                    throw new Error('Failed to toggle service');
                }

                // Reload page to update UI
                setTimeout(() => window.location.reload(), 300);
            } catch (error) {
                console.error('Error toggling service:', error);
                alert('Error al cambiar el estado del servicio');
            }
        },

        downloadCompose() {
            window.location.href = '/docker-compose/download';
        }
    }
}
</script>
