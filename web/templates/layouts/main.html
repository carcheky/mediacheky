<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - MediaCheky</title>
    <link rel="stylesheet" href="/static/css/custom.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Shared utilities - Load before Alpine.js components -->
    <script src="/static/js/shared.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            surface: '#1e293b',
                            border: '#334155',
                            text: '#e2e8f0',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js Components - Load before Alpine.js initializes -->
    <script src="/static/js/file-health-components.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-dark-bg dark:bg-dark-bg min-h-screen flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="bg-dark-surface shadow-lg sticky top-0 z-50 border-b border-dark-border" x-data="{ mobileMenuOpen: false, currentPath: window.location.pathname, i18nReady: false }" @i18n:changed.window="i18nReady = true" x-init="setTimeout(() => i18nReady = true, 100)">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-stretch justify-between h-16">
                <!-- Logo -->
                <div class="flex items-center flex-shrink-0">
                    <a href="/" class="flex items-center gap-2">
                        <span class="text-2xl">🦊</span>
                        <h1 class="text-xl font-bold text-dark-text">MediaCheky</h1>
                    </a>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-stretch ml-8 space-x-1" x-show="i18nReady" x-transition:opacity>
                    <a href="/"
                        :class="currentPath === '/' ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-400 hover:text-dark-text'"
                        class="inline-flex items-center px-4 border-b-2 text-sm font-medium transition-all duration-150">
                        <span class="mr-2">📊</span>
                        <span data-i18n-key="nav.dashboard">Dashboard</span>
                    </a>

                    <div class="relative flex items-stretch" x-data="servicesMenu()" @mouseenter="open = true" @mouseleave="open = false" x-init="init()">
                        <a href="/services"
                            :class="currentPath.startsWith('/services') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-400 hover:text-dark-text'"
                            class="inline-flex items-center px-4 border-b-2 text-sm font-medium transition-all duration-150">
                            <span class="mr-2">🎬</span>
                            <span data-i18n-key="nav.services">Services</span>
                            <svg class="w-4 h-4 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </a>
                        <!-- Services Dropdown -->
                        <div x-show="open" 
                             x-transition:enter="transition ease-out duration-100"
                             x-transition:enter-start="transform opacity-0 scale-95"
                             x-transition:enter-end="transform opacity-100 scale-100"
                             class="absolute left-0 top-full mt-0 w-72 bg-dark-surface border border-dark-border rounded-lg shadow-2xl z-50 max-h-96 overflow-y-auto">
                            
                            <!-- Enabled Services -->
                            <div class="p-2">
                                <div class="px-2 py-1 text-xs font-semibold text-green-400 uppercase tracking-wider">
                                    ✅ <span data-i18n-key="nav.services.enabled">Enabled Services</span>
                                </div>
                                <template x-for="service in allServices.filter(s => serviceStatuses[s.id]?.enabled)" :key="service.id">
                                    <a :href="'/services/' + service.id"
                                       class="flex items-center gap-3 px-3 py-2 rounded hover:bg-dark-bg transition-colors cursor-pointer group">
                                        <div class="text-2xl" x-text="service.icon"></div>
                                        <div class="flex-1 min-w-0">
                                            <div class="text-sm font-medium text-dark-text group-hover:text-blue-400 transition-colors" x-text="service.label"></div>
                                            <div class="text-xs text-dark-muted truncate" x-text="service.description"></div>
                                        </div>
                                        <div class="flex-shrink-0">
                                            <div class="w-2 h-2 rounded-full bg-green-500"></div>
                                        </div>
                                    </a>
                                </template>
                                <template x-if="allServices.filter(s => serviceStatuses[s.id]?.enabled).length === 0">
                                    <div class="px-3 py-2 text-sm text-dark-muted italic" data-i18n-key="nav.services.no_enabled">No enabled services</div>
                                </template>
                            </div>
                            
                            <!-- Divider -->
                            <div class="border-t border-dark-border"></div>
                            
                            <!-- Disabled Services -->
                            <div class="p-2">
                                <div class="px-2 py-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                    ⚫ <span data-i18n-key="nav.services.disabled">Disabled Services</span>
                                </div>
                                <template x-for="service in allServices.filter(s => !serviceStatuses[s.id]?.enabled)" :key="service.id">
                                    <a :href="'/services/' + service.id"
                                       class="flex items-center gap-3 px-3 py-2 rounded hover:bg-dark-bg transition-colors cursor-pointer group opacity-60 hover:opacity-100">
                                        <div class="text-2xl grayscale" x-text="service.icon"></div>
                                        <div class="flex-1 min-w-0">
                                            <div class="text-sm font-medium text-dark-muted group-hover:text-dark-text transition-colors" x-text="service.label"></div>
                                            <div class="text-xs text-dark-muted truncate" x-text="service.description"></div>
                                        </div>
                                        <div class="flex-shrink-0">
                                            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
                                        </div>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>

                    <a href="/settings"
                        :class="currentPath.startsWith('/settings') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-400 hover:text-dark-text'"
                        class="inline-flex items-center px-4 border-b-2 text-sm font-medium transition-all duration-150">
                        <span class="mr-2">⚙️</span>
                        <span data-i18n-key="nav.settings">Settings</span>
                    </a>

                    <a href="/logs"
                        :class="currentPath.startsWith('/logs') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-400 hover:text-dark-text'"
                        class="inline-flex items-center px-4 border-b-2 text-sm font-medium transition-all duration-150">
                        <span class="mr-2">📜</span>
                        <span data-i18n-key="nav.logs">Logs</span>
                    </a>
                </div>

                <!-- Language Selector (Desktop) -->
                <div class="hidden md:flex items-center ml-auto">
                    <div x-data="{ lang: 'en', updateLanguage() { window.i18n.setLang(this.lang); }, init() { this.lang = window.i18n.lang; document.addEventListener('i18n:changed', (e) => { this.lang = e.detail.lang; }); } }" x-init="init()">
                        <label class="sr-only" for="language-selector">Language</label>
                        <select id="language-selector" 
                                x-model="lang" 
                                @change="updateLanguage()"
                                class="px-3 py-1.5 border border-dark-border rounded-md bg-dark-bg text-dark-text text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
                            <option value="en">🇬🇧 English</option>
                            <option value="es">🇪🇸 Español</option>
                        </select>
                    </div>
                </div>

                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden ml-auto">
                    <button @click="mobileMenuOpen = !mobileMenuOpen" 
                            type="button" 
                            aria-label="Toggle menu"
                            class="p-2 rounded-md text-dark-muted hover:text-dark-text hover:bg-dark-bg transition-colors">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" 
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-1"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-1"
             class="md:hidden border-t border-dark-border bg-dark-surface">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="/" 
                   @click="mobileMenuOpen = false"
                   :class="currentPath === '/' ? 'bg-dark-bg border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'"
                   class="flex items-center px-3 py-2 rounded-md text-sm font-medium border-l-4 transition-colors">
                    <span class="mr-2">📊</span>
                    <span data-i18n-key="nav.dashboard">Dashboard</span>
                </a>

                <a href="/services" 
                   @click="mobileMenuOpen = false"
                   :class="currentPath.startsWith('/services') ? 'bg-dark-bg border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'"
                   class="flex items-center px-3 py-2 rounded-md text-sm font-medium border-l-4 transition-colors">
                    <span class="mr-2">🎬</span>
                    <span data-i18n-key="nav.services">Services</span>
                </a>

                <a href="/settings" 
                   @click="mobileMenuOpen = false"
                   :class="currentPath.startsWith('/settings') ? 'bg-dark-bg border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'"
                   class="flex items-center px-3 py-2 rounded-md text-sm font-medium border-l-4 transition-colors">
                    <span class="mr-2">⚙️</span>
                    <span data-i18n-key="nav.settings">Settings</span>
                </a>

                <a href="/logs" 
                   @click="mobileMenuOpen = false"
                   :class="currentPath.startsWith('/logs') ? 'bg-dark-bg border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'"
                   class="flex items-center px-3 py-2 rounded-md text-sm font-medium border-l-4 transition-colors">
                    <span class="mr-2">📜</span>
                    <span data-i18n-key="nav.logs">Logs</span>
                </a>
            </div>

            <!-- Mobile Language Selector -->
            <div class="border-t border-dark-border px-4 py-3">
                <div x-data="{ lang: 'en', updateLanguage() { window.i18n.setLang(this.lang); }, init() { this.lang = window.i18n.lang; document.addEventListener('i18n:changed', (e) => { this.lang = e.detail.lang; }); } }" x-init="init()">
                    <label class="block text-xs font-medium text-dark-muted mb-1.5" for="language-selector-mobile">
                        Language / Idioma
                    </label>
                    <select id="language-selector-mobile" 
                            x-model="lang" 
                            @change="updateLanguage()"
                            class="w-full px-3 py-2 border border-dark-border rounded-md bg-dark-bg text-dark-text text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="en">🇬🇧 English</option>
                        <option value="es">🇪🇸 Español</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full py-6 px-4 sm:px-6 lg:px-8">
        {{embed}}
    </main>

    <!-- Global Toast Notifications -->
    <div x-data="{ toast: { show: false, message: '', type: 'success' }, showToast(message, type='success') { this.toast.message = message; this.toast.type = type; this.toast.show = true; setTimeout(() => { this.toast.show = false; }, type === 'success' ? 5000 : 8000); } }"
         x-ref="globalToast"
         x-show="toast.show"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="fixed top-4 right-4 z-50 max-w-md"
         style="display: none;">
        <div :class="{
                'bg-green-900/95 border-green-700': toast.type === 'success',
                'bg-red-900/95 border-red-700': toast.type === 'error',
                'bg-blue-900/95 border-blue-700': toast.type === 'info'
            }" class="backdrop-blur-sm border rounded-lg shadow-2xl p-4 flex items-start gap-3">
            <!-- Icon -->
            <div class="flex-shrink-0">
                <svg x-show="toast.type === 'success'" class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <svg x-show="toast.type === 'error'" class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <svg x-show="toast.type === 'info'" class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 18a6 6 0 100-12 6 6 0 000 12z"></path>
                </svg>
            </div>
            <!-- Message -->
            <div class="flex-1">
                <p :class="{
                        'text-green-100': toast.type === 'success',
                        'text-red-100': toast.type === 'error',
                        'text-blue-100': toast.type === 'info'
                    }" class="text-sm font-medium" x-text="toast.message"></p>
            </div>
            <!-- Close Button -->
            <button @click="toast.show = false" class="flex-shrink-0 text-gray-400 hover:text-gray-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark-surface dark:bg-dark-surface border-t border-dark-border mt-auto">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2">
                <p class="text-sm text-dark-muted">
                    MediaCheky v{{.Version}} - Centralized control panel for *arr services
                </p>
                <div class="flex items-center gap-4 text-sm text-dark-muted">
                    <a href="https://github.com/carcheky/mediacheky" target="_blank" rel="noopener noreferrer" 
                       class="hover:text-dark-text transition-colors">
                        GitHub
                    </a>
                    <span>Port 7369 🦊</span>
                </div>
            </div>
        </div>
    </footer>
</body>
<script>
// Services dropdown component: show all services grouped by enabled/disabled
function servicesMenu() {
    return {
        open: false,
        allServices: [
            { id: 'jellyfin',   label: 'Jellyfin',   icon: '🍿', description: 'Media server for streaming movies, TV shows, and music' },
            { id: 'radarr',     label: 'Radarr',     icon: '🎬', description: 'Movie collection manager for Usenet and BitTorrent' },
            { id: 'sonarr',     label: 'Sonarr',     icon: '📺', description: 'TV series collection manager for Usenet and BitTorrent' },
            { id: 'prowlarr',   label: 'Prowlarr',   icon: '🔍', description: 'Indexer manager/proxy for Radarr, Sonarr, and other services' },
            { id: 'bazarr',     label: 'Bazarr',     icon: '🗣️', description: 'Subtitle management companion for Radarr and Sonarr' },
            { id: 'jellyseerr', label: 'Jellyseerr', icon: '🎫', description: 'Media request management for Jellyfin' },
            { id: 'jellystat',  label: 'Jellystat',  icon: '📊', description: 'Statistics and analytics for Jellyfin' },
            { id: 'qbittorrent',label: 'qBittorrent',icon: '⬇️', description: 'BitTorrent client for downloading media' }
        ],
        serviceStatuses: {},
        async init() {
            try {
                const resp = await fetch('/api/services');
                if (resp.ok) {
                    const data = await resp.json();
                    const services = data.data || data;
                    const statuses = {};
                    (services || []).forEach(svc => {
                        statuses[svc.name] = { 
                            enabled: svc.enabled, 
                            status: svc.status 
                        };
                    });
                    this.serviceStatuses = statuses;
                }
            } catch (e) { /* ignore */ }
        }
    }
}

    let lang = 'en';
    function t(key) { return (dict[lang] && dict[lang][key]) || key; }
    async function setLang(l) { lang = l || 'en';
        try {
            await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ global: { language: lang } }) });
            // Show toast on success
            const toastRoot = document.querySelector('[x-ref="globalToast"]');
            if (toastRoot && toastRoot.__x) {
                toastRoot.__x.$data.showToast(
                    t('settings.title') + ' - ' + (lang === 'es' ? 'Idioma actualizado' : 'Language updated'),
                    'success'
                );
            }
        } catch (e) {
            console.error('language save failed', e);
        }
        document.dispatchEvent(new CustomEvent('i18n:changed', { detail: { lang } }));
    }
    // Initialize from backend config
    (async function initLang() {
        try {
            const resp = await fetch('/api/config');
            if (resp.ok) {
                const data = await resp.json();
                if (data && data.global && data.global.language) {
                    lang = data.global.language;
                    document.dispatchEvent(new CustomEvent('i18n:changed', { detail: { lang } }));
                }
            }
        } catch (e) { /* ignore */ }
    })();
    return { t, setLang, get lang() { return lang; } };
})();

// Global i18n updater: fill all elements with data-i18n-key
function applyI18nTexts() {
    document.querySelectorAll('[data-i18n-key]').forEach(el => {
        const key = el.getAttribute('data-i18n-key');
        el.textContent = window.i18n.t(key);
    });
}
document.addEventListener('DOMContentLoaded', applyI18nTexts);
document.addEventListener('i18n:changed', applyI18nTexts);
