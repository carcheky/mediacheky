<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - MediaCheky</title>
    <link rel="stylesheet" href="/static/css/custom.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Shared utilities - Load before Alpine.js components -->
    <script src="/static/js/shared.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            surface: '#1e293b',
                            border: '#334155',
                            text: '#e2e8f0',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js Components - Load before Alpine.js initializes -->
    <script src="/static/js/file-health-components.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-dark-bg dark:bg-dark-bg min-h-screen flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="bg-dark-surface dark:bg-dark-surface shadow-lg border-b border-dark-border sticky top-0 z-50" x-data="{ mobileMenuOpen: false, currentPath: window.location.pathname }">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-20 border-b border-dark-border/70 bg-gradient-to-r from-dark-surface via-dark-bg to-dark-surface shadow-lg">
                <div class="flex items-center w-full">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="flex items-center gap-2">
                            <span class="text-2xl">🦊</span>
                            <h1 class="text-2xl font-extrabold tracking-tight text-dark-text dark:text-dark-text drop-shadow">MediaCheky</h1>
                        </a>
                    </div>
                    <div class="hidden sm:flex sm:space-x-2 ml-6 transition-opacity duration-300" x-data x-bind:class="i18nReady ? 'opacity-100' : 'opacity-0'">
                        <a href="/"
                            :class="currentPath==='/' ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-500 hover:text-dark-text dark:text-dark-muted dark:hover:text-dark-text'"
                            class="inline-flex items-center px-3 py-6 border-b-2 text-sm font-medium min-w-[100px] transition-all duration-200">
                            <span class="mr-1">📊</span>
                            <span data-i18n-key="nav.dashboard">Dashboard</span>
                        </a>
                        <div class="relative min-w-[100px]" x-data="servicesMenu()" @mouseenter="open = true" @mouseleave="open = false" x-init="init()">
                            <a href="/services"
                                :class="currentPath.startsWith('/services') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-500 hover:text-dark-text dark:text-dark-muted dark:hover:text-dark-text'"
                                class="inline-flex items-center px-3 py-6 border-b-2 text-sm font-medium min-w-[100px] transition-all duration-200">
                                <span class="mr-1">🎬</span>
                                <span data-i18n-key="nav.services">Services</span>
                                <svg class="w-4 h-4 ml-1 text-dark-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </a>
                            <!-- Services Dropdown -->
                            <div x-show="open" x-transition class="absolute mt-2 w-56 bg-dark-surface border border-dark-border rounded-md shadow-xl py-2">
                                <template x-for="svc in enabledServices" :key="svc.name">
                                    <a :href="'/services/' + svc.name" class="block px-3 py-2 text-sm text-dark-text hover:bg-dark-bg">
                                        <span x-text="iconFor(svc.name)"></span>
                                        <span class="ml-1" x-text="labelFor(svc.name)"></span>
                                    </a>
                                </template>
                                <div x-show="enabledServices.length === 0" class="px-3 py-2 text-sm text-dark-muted">No services enabled</div>
                            </div>
                        </div>
                        <a href="/settings"
                            :class="currentPath.startsWith('/settings') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-500 hover:text-dark-text dark:text-dark-muted dark:hover:text-dark-text'"
                            class="inline-flex items-center px-3 py-6 border-b-2 text-sm font-medium min-w-[100px] transition-all duration-200">
                            <span class="mr-1">⚙️</span>
                            <span data-i18n-key="nav.settings">Settings</span>
                        </a>
                        <a href="/logs"
                            :class="currentPath.startsWith('/logs') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:border-blue-500 hover:text-dark-text dark:text-dark-muted dark:hover:text-dark-text'"
                            class="inline-flex items-center px-3 py-6 border-b-2 text-sm font-medium min-w-[100px] transition-all duration-200">
                            <span class="mr-1">📜</span>
                            <span data-i18n-key="nav.logs">Logs</span>
                        </a>
                    </div>
                </div>
                <!-- Right side: Language selector (desktop) -->
                <div class="hidden sm:flex items-center gap-3 justify-end">
                    <div x-data="{ lang: 'en', updateLanguage() { window.i18n.setLang(this.lang); }, init() { this.lang = window.i18n.lang; document.addEventListener('i18n:changed', (e) => { this.lang = e.detail.lang; }); } }" x-init="init()">
                        <label class="sr-only" for="global-language">Language</label>
                        <select id="global-language" x-model="lang" @change="updateLanguage()"
                                class="px-2 py-2 border border-dark-border rounded-md bg-dark-bg text-dark-text focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm">
                            <option value="en">English</option>
                            <option value="es">Español</option>
                            
                        </select>
                    </div>
                </div>
                <!-- Mobile menu button -->
                <div class="flex items-center sm:hidden">
                    <button @click="mobileMenuOpen = !mobileMenuOpen" type="button" 
                        aria-label="Toggle mobile menu"
                        class="inline-flex items-center justify-center p-2 rounded-md text-dark-muted hover:text-dark-text hover:bg-dark-bg focus:outline-none">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile menu -->
        <div x-show="mobileMenuOpen" x-transition class="sm:hidden border-t border-dark-border">
            <div class="pt-2 pb-3 space-y-1">
                <a href="/" :class="currentPath==='/' ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'" class="block pl-3 pr-4 py-2 border-l-4">
                    <span class="mr-1">📊</span>
                    <span data-i18n-key="nav.dashboard">Dashboard</span>
                </a>
                <a href="/services" :class="currentPath.startsWith('/services') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'" class="block pl-3 pr-4 py-2 border-l-4">
                    <span class="mr-1">🎬</span>
                    <span data-i18n-key="nav.services">Services</span>
                </a>
                <a href="/settings" :class="currentPath.startsWith('/settings') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'" class="block pl-3 pr-4 py-2 border-l-4">
                    <span class="mr-1">⚙️</span>
                    <span data-i18n-key="nav.settings">Settings</span>
                </a>
                <a href="/logs" :class="currentPath.startsWith('/logs') ? 'border-blue-500 text-dark-text' : 'border-transparent text-dark-muted hover:bg-dark-bg hover:text-dark-text'" class="block pl-3 pr-4 py-2 border-l-4">
                    <span class="mr-1">📜</span>
                    <span data-i18n-key="nav.logs">Logs</span>
                </a>
                <!-- Mobile: Language selector -->
                <div class="px-3 pt-2">
                    <div x-data="{ lang: 'en', updateLanguage() { window.i18n.setLang(this.lang); }, init() { this.lang = window.i18n.lang; document.addEventListener('i18n:changed', (e) => { this.lang = e.detail.lang; }); } }" x-init="init()">
                        <label class="sr-only" for="global-language-mobile">Language</label>
                        <select id="global-language-mobile" x-model="lang" @change="updateLanguage()"
                                class="w-full px-3 py-2 border border-dark-border rounded-md bg-dark-bg text-dark-text focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm">
                            <option value="en">English</option>
                            <option value="es">Español</option>
                            
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full py-6 px-4 sm:px-6 lg:px-8">
        {{embed}}
    </main>

    <!-- Global Toast Notifications -->
    <div x-data="{ toast: { show: false, message: '', type: 'success' }, showToast(message, type='success') { this.toast.message = message; this.toast.type = type; this.toast.show = true; setTimeout(() => { this.toast.show = false; }, type === 'success' ? 5000 : 8000); } }"
         x-ref="globalToast"
         x-show="toast.show"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="fixed top-4 right-4 z-50 max-w-md"
         style="display: none;">
        <div :class="{
                'bg-green-900/95 border-green-700': toast.type === 'success',
                'bg-red-900/95 border-red-700': toast.type === 'error',
                'bg-blue-900/95 border-blue-700': toast.type === 'info'
            }" class="backdrop-blur-sm border rounded-lg shadow-2xl p-4 flex items-start gap-3">
            <!-- Icon -->
            <div class="flex-shrink-0">
                <svg x-show="toast.type === 'success'" class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <svg x-show="toast.type === 'error'" class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <svg x-show="toast.type === 'info'" class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 18a6 6 0 100-12 6 6 0 000 12z"></path>
                </svg>
            </div>
            <!-- Message -->
            <div class="flex-1">
                <p :class="{
                        'text-green-100': toast.type === 'success',
                        'text-red-100': toast.type === 'error',
                        'text-blue-100': toast.type === 'info'
                    }" class="text-sm font-medium" x-text="toast.message"></p>
            </div>
            <!-- Close Button -->
            <button @click="toast.show = false" class="flex-shrink-0 text-gray-400 hover:text-gray-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark-surface dark:bg-dark-surface border-t border-dark-border mt-auto">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2">
                <p class="text-sm text-dark-muted">
                    MediaCheky v{{.Version}} - Centralized control panel for *arr services
                </p>
                <div class="flex items-center gap-4 text-sm text-dark-muted">
                    <a href="https://github.com/carcheky/mediacheky" target="_blank" rel="noopener noreferrer" 
                       class="hover:text-dark-text transition-colors">
                        GitHub
                    </a>
                    <span>Port 7369 🦊</span>
                </div>
            </div>
        </div>
    </footer>
</body>
<script>
// Services dropdown component: show only enabled services
function servicesMenu() {
    return {
        open: false,
        enabledServices: [],
        async init() {
            try {
                const resp = await fetch('/api/services');
                if (resp.ok) {
                    const data = await resp.json();
                    const services = data.data || data;
                    this.enabledServices = (services || []).filter(s => s.enabled);
                }
            } catch (e) { /* ignore */ }
        },
        iconFor(name) {
            const icons = { radarr: '🎬', sonarr: '📺', jellyfin: '🍿', qbittorrent: '⬇️', prowlarr: '🔍', bazarr: '🗣️', jellyseerr: '🎫', jellystat: '📊' };
            return icons[name] || '🛠️';
        },
        labelFor(name) {
            const labels = { radarr: 'Radarr', sonarr: 'Sonarr', jellyfin: 'Jellyfin', qbittorrent: 'qBittorrent', prowlarr: 'Prowlarr', bazarr: 'Bazarr', jellyseerr: 'Jellyseerr', jellystat: 'Jellystat' };
            return labels[name] || name;
        }
    }
}

// Minimal i18n
window.i18n = (function() {
    const dict = {
        en: {
            'nav.dashboard': 'Dashboard',
            'nav.services': 'Services',
            'nav.settings': 'Settings',
            'nav.logs': 'Logs',
            'settings.title': 'Settings',

            // Common
            'common.refresh': 'Refresh',
            'common.loading': 'Loading...',
            'common.syncing': 'Syncing...',

            // Dashboard
            'dashboard.title': 'Dashboard',
            'dashboard.sync': 'Sync Now',
            'dashboard.services': 'Services',
            'dashboard.empty.noEnabled': 'No enabled services yet.',
            'dashboard.empty.enable': 'Enable Services →',

            // Queues / Sections
            'radarr.queue.title': 'Radarr Download Queue',
            'sonarr.queue.title': 'Sonarr Download Queue',
            'jellyfin.sessions.title': 'Jellyfin - Active Sessions',
            'jellyfin.recent.title': 'Jellyfin - Recently Added',
            'qb.title': 'qBittorrent',

            // Quick Actions
            'dashboard.quick.title': 'Quick Actions',
            'dashboard.quick.viewmedia': 'View Media',
            'dashboard.quick.viewmedia.help': 'Browse and manage your media library',
            'dashboard.quick.configure': 'Configure Services',
            'dashboard.quick.configure.help': 'Set up Radarr, Sonarr, Jellyfin, etc.',
            'dashboard.quick.schedules': 'Manage Schedules',
            'dashboard.quick.schedules.help': 'Configure cleanup schedules'
        },
        es: {
            'nav.dashboard': 'Panel',
            'nav.services': 'Servicios',
            'nav.settings': 'Ajustes',
            'nav.logs': 'Logs',
            'settings.title': 'Ajustes',

            // Common
            'common.refresh': 'Actualizar',
            'common.loading': 'Cargando...',
            'common.syncing': 'Sincronizando...',

            // Dashboard
            'dashboard.title': 'Panel',
            'dashboard.sync': 'Sincronizar ahora',
            'dashboard.services': 'Servicios',
            'dashboard.empty.noEnabled': 'Aún no hay servicios habilitados.',
            'dashboard.empty.enable': 'Habilitar servicios →',

            // Queues / Sections
            'radarr.queue.title': 'Cola de descargas de Radarr',
            'sonarr.queue.title': 'Cola de descargas de Sonarr',
            'jellyfin.sessions.title': 'Jellyfin - Sesiones activas',
            'jellyfin.recent.title': 'Jellyfin - Agregados recientemente',
            'qb.title': 'qBittorrent',

            // Quick Actions
            'dashboard.quick.title': 'Acciones rápidas',
            'dashboard.quick.viewmedia': 'Ver biblioteca',
            'dashboard.quick.viewmedia.help': 'Explora y gestiona tu biblioteca multimedia',
            'dashboard.quick.configure': 'Configurar servicios',
            'dashboard.quick.configure.help': 'Configura Radarr, Sonarr, Jellyfin, etc.',
            'dashboard.quick.schedules': 'Gestionar horarios',
            'dashboard.quick.schedules.help': 'Configura tareas de limpieza'
        },
        
    };
    let lang = 'en';
    function t(key) { return (dict[lang] && dict[lang][key]) || key; }
    async function setLang(l) { lang = l || 'en';
        try {
            await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ global: { language: lang } }) });
            // Show toast on success
            const toastRoot = document.querySelector('[x-ref="globalToast"]');
            if (toastRoot && toastRoot.__x) {
                toastRoot.__x.$data.showToast(
                    t('settings.title') + ' - ' + (lang === 'es' ? 'Idioma actualizado' : 'Language updated'),
                    'success'
                );
            }
        } catch (e) {
            console.error('language save failed', e);
        }
        document.dispatchEvent(new CustomEvent('i18n:changed', { detail: { lang } }));
    }
    // Initialize from backend config
    (async function initLang() {
        try {
            const resp = await fetch('/api/config');
            if (resp.ok) {
                const data = await resp.json();
                if (data && data.global && data.global.language) {
                    lang = data.global.language;
                    document.dispatchEvent(new CustomEvent('i18n:changed', { detail: { lang } }));
                }
            }
        } catch (e) { /* ignore */ }
    })();
    return { t, setLang, get lang() { return lang; } };
})();

// Global i18n updater: fill all elements with data-i18n-key
function applyI18nTexts() {
    document.querySelectorAll('[data-i18n-key]').forEach(el => {
        const key = el.getAttribute('data-i18n-key');
        el.textContent = window.i18n.t(key);
    });
}
document.addEventListener('DOMContentLoaded', applyI18nTexts);
document.addEventListener('i18n:changed', applyI18nTexts);
</script>

</html>
